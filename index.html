<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opus Lilium — Devotional Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #EDE0B8;
    --green: #3B5D45;
    --umber: #6B4226;
    --halo: #D9A84E;
    --ink: #2A241C;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--parchment);
    color: var(--ink);
    font-family: 'Source Sans 3', sans-serif;
  }

  .site-header {
    padding: 28px 6vw 0;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.4rem;
    letter-spacing: 0.02em;
    color: var(--green);
    text-decoration: none;
  }

  .site-header nav a {
    font-size: 0.95rem;
    color: var(--ink);
    text-decoration: none;
    margin-left: 28px;
    opacity: 0.75;
  }

  .site-header nav a:hover { opacity: 1; }

  .intro {
    max-width: 640px;
    margin: 0 auto;
    padding: 7vh 6vw 5vh;
    text-align: center;
  }

  .intro h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(2.2rem, 4vw, 3rem);
    margin: 0 0 16px;
  }

  .intro p {
    font-size: 1.05rem;
    line-height: 1.6;
    color: #443c2e;
    margin: 0;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 40px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 6vw 10vh;
  }

  .piece {
    display: block;
    text-decoration: none;
    color: inherit;
  }

  .piece img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 2px;
    box-shadow: 0 20px 40px -20px rgba(42, 36, 28, 0.4);
    transition: transform 0.2s ease;
  }

  .piece:hover img { transform: translateY(-3px); }

  .piece-caption {
    margin-top: 16px;
  }

  .piece-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.3rem;
    margin: 0 0 4px;
  }

  .piece-meta {
    font-size: 0.92rem;
    color: var(--umber);
    margin: 0;
  }

  footer {
    text-align: center;
    padding: 30px 6vw 40px;
    font-size: 0.85rem;
    color: #6b5f4a;
    border-top: 1px solid rgba(42,36,28,0.12);
  }
</style>
</head>
<body>

<header class="site-header">
  <a class="wordmark" href="/">Opus Lilium</a>
  <nav>
    <a href="#">About</a>
  </nav>
</header>

<div class="intro">
  <h1>Devotional art, made to hang</h1>
  <p>Original illustrations of the saints and holy family, brought to print &mdash; each piece linking to where you can bring it home.</p>
</div>

<div class="gallery">

  <a class="piece" href="https://opuslilium.printful.me/product/metal-prints" target="_blank" rel="noopener">
    <img src="st-joseph-and-child-jesus.png" alt="Illustration of St. Joseph the Worker holding a hammer and tool pouch, with the Child Jesus reaching up to hold his tunic, both haloed">
    <div class="piece-caption">
      <p class="piece-title">St. Joseph and the Child Jesus</p>
      <p class="piece-meta">Metal print, 11 × 17</p>
    </div>
  </a>

  <!-- To add another piece, copy the <a class="piece">...</a> block above,
       swap the image, link, title, and meta text. -->

</div>

<footer>
  Opus Lilium &mdash; devotional art by Andre
</footer>

</body>
</html>
